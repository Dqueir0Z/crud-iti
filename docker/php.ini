; Ajustes do container sobre o php.ini-production.

expose_php = Off
date.timezone = America/Sao_Paulo

; Importação do structure.json: arquivo até 10 MB (ImportacaoForm), com folga.
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M
max_execution_time = 120

; Sessão em arquivo: some quando o container reinicia ou "dorme" (basta entrar de novo).
session.save_path = "/tmp/sessoes"
session.use_strict_mode = 1

; O código não muda dentro do container.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
