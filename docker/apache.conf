# Site único do container. A porta vem da variável PORT (o Render define 10000).
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        AllowOverride All
        Require all granted
    </Directory>

    # O TLS termina no proxy do Render; ele avisa pelo cabeçalho X-Forwarded-Proto.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # Demonstração para o avaliador: fora dos buscadores.
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Plano gratuito: pouca memória e no máximo 76 conexões no MySQL da Aiven.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers      10
    MaxConnectionsPerChild 500
</IfModule>

ServerTokens Prod
ServerSignature Off
